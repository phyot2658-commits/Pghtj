<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      font-family: 'Spotify Circular', Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }
    .spotify-header {
      width: 100%;
      padding: 24px 0 16px 24px;
      background: linear-gradient(180deg, #1db954 0%, #121212 100%);
      font-size: 28px;
      font-weight: 700;
      color: #191414;
      box-sizing: border-box;
    }
    .main-container {
      width: 95%;
      max-width: 850px;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .player-card {
      width: 100%;
      background-color: #181818;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 60px rgba(0,0,0,0.5);
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 4px;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .now-playing-info {
      margin-top: 20px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .track-details h2 {
      margin: 0 0 4px 0;
      font-size: 22px;
      color: #fff;
    }
    .track-details p {
      margin: 0;
      color: #b3b3b3;
      font-size: 14px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #282828;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #1db954;
      font-weight: bold;
    }
    .playing-animation {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 15px;
    }
    .bar {
      width: 3px;
      background-color: #1db954;
      animation: jump 1s infinite ease-in-out;
    }
    .bar:nth-child(1) { animation-delay: 0.1s; }
    .bar:nth-child(2) { animation-delay: 0.3s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.4s; }
    @keyframes jump {
      0%, 100% { height: 5px; }
      50% { height: 15px; }
    }
  </style>
</head>
<body>

  <div class="spotify-header">San Lynn Radio</div>

  <div class="main-container">
    <div class="player-card">
      <div class="video-wrapper">
        <div id="player"></div>
      </div>
      
      <div class="now-playing-info">
        <div class="track-details">
          <h2>Continuous Stream</h2>
          <p>San Lynn Official Playlist</p>
        </div>
        <div class="status-indicator">
          <div class="playing-animation">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
          PLAYING
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        playerVars: {
          'listType': 'playlist',
          'list': 'UUB6qlkorHPvHeQrFcJl2Xhg',
          'autoplay': 1,
          'loop': 1,
          'rel': 0,
          'origin': window.location.origin
        },
        events: {
          'onReady': onPlayerReady,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      event.target.playVideo();
    }

    function onPlayerError(event) {
      player.nextVideo();
    }
  </script>
</body>
</html>
